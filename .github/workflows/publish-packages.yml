name: Publish GitHub packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@amangalvedhekar'

      - run: npm ci
      - run: npx nx run-many -t lint test typecheck -p @amangalvedhekar/test-ids @amangalvedhekar/components
      - run: npm run build:packages
      - run: npm run release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
